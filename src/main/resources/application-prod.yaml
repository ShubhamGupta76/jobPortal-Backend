

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://job-portal-ui-ten.vercel.app}
  billing:
    webhook-secret: ${BILLING_WEBHOOK_SECRET}

piston:
  # Optional: no default, and deliberately NOT "http://localhost:2000" (that would silently
  # point at nothing in this container). An unset PISTON_API_URL now resolves to an empty
  # string instead of failing startup; PistonService checks for that and fails each
  # code-execution request gracefully (503) rather than the whole app refusing to start.
  # Set PISTON_API_URL to a real, reachable Piston deployment to enable code execution.
  api:
    url: ${PISTON_API_URL:}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:/tmp/jobportal/uploads}

logging:
  level:
    com.job_Portal_Backend: INFO
