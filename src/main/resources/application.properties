# ================= REDIS =================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}


# ================= JPA =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================= JWT =================
jwt.secret=mySuperSecureJwtSecretKeyForJobPortal2026AuthToken123456789
jwt.expiration=86400000

# ================= CORS =================
# Comma-separated allowed origin patterns.
app.cors.allowed-origins=https://job-portal-ui-ten.vercel.app,http://localhost:5173,http://127.0.0.1:5173

server.address=0.0.0.0

# ================= FILE UPLOAD =================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ================= SERVER =================
server.port=8080

# ================= PISTON CODE EXECUTION =================
piston.api.url=${PISTON_API_URL:http://localhost:2000}

# ================= EMAIL (GMAIL SMTP) =================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:gshubhamkumar01@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:crsjcpilozabxxpm}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# ================= OTP CONFIG =================
app.otp.expiry-minutes=5
app.otp.max-attempts=3
app.otp.resend-delay-seconds=30

# ================= SESSIONS =================
# Refresh-token session lifetime, additive to the existing 24h JWT access token.
app.session.refresh-token-expiry-days=30

# ================= BILLING =================
# HMAC-SHA256 secret used to verify ManualPaymentProvider webhook signatures. No real payment
# gateway (e.g. Stripe) is configured in this environment; set a strong secret in production and
# rotate it if ever exposed. Never log or expose this value.
app.billing.webhook-secret=changeme-billing-webhook-secret

# ================= LOGGING =================
logging.level.com.job_Portal_Backend=DEBUG
