spring.application.name=job-portal-backend

# ================= ACTIVE PROFILE =================
# No SPRING_PROFILES_ACTIVE set -> "local" (today's exact behavior, zero setup required for
# existing local development). Render sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ================= SERVER =================
# Render injects PORT at runtime; local dev falls back to 8080.
server.address=0.0.0.0
server.port=${PORT:8080}

# ================= JPA =================
# ddl-auto stays 'update' in every environment per the existing no-migrations strategy.
spring.jpa.hibernate.ddl-auto=update

# ================= FILE UPLOAD =================
# Multipart size limits are a business rule, not environment-specific.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ================= OTP CONFIG =================
app.otp.expiry-minutes=5
app.otp.max-attempts=3
app.otp.resend-delay-seconds=30

# ================= SESSIONS =================
# Refresh-token session lifetime, additive to the existing 24h JWT access token.
app.session.refresh-token-expiry-days=30
